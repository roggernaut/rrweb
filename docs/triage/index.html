<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rrweb intake triage — 2026-11-06</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #12140f;
    --bg-2: #1b1e16;
    --bg-3: #23281c;
    --ink: #f3efe2;
    --muted: #9a937c;
    --line: #3a3f2f;
    --accent: #d4a017;
    --accent-2: #7eb8a0;
    --merge: #d4a017;
    --adopt: #7eb8a0;
    --review: #8aa4d4;
    --discuss: #c48bdb;
    --cleanup: #d4b07a;
    --reject: #d37a6a;
    --bulk: #7a7668;
    --chip: #2a2e22;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 "IBM Plex Sans", "Source Sans 3", "Segoe UI", sans-serif; }
  a { color: #e8c56a; }
  a:hover { color: #ffe08a; }
  header.page {
    padding: 16px 28px 8px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #191c13 0%, var(--bg) 100%);
    position: sticky; top: 0; z-index: 20;
  }
  h1 { font-size: 20px; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 2px; }
  .lede { color: var(--muted); margin: 0 0 10px; font-size: 12px; }
  /* Two rows of pills: buckets (any of the selected), then narrowing filters (all of the selected). */
  .filters { display: grid; gap: 6px; margin: 0 0 10px; }
  .frow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .flabel { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; width: 52px; flex: 0 0 52px; }
  .pill {
    appearance: none; border: 1px solid var(--line); background: transparent;
    color: var(--ink); padding: 3px 9px 3px 7px; border-radius: 999px; cursor: pointer;
    font: inherit; font-size: 12px; line-height: 1.3; display: inline-flex; align-items: center; gap: 6px;
  }
  .pill:hover, .pill:focus-visible { border-color: var(--muted); }
  .pill .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pill, var(--muted)); flex: none; }
  .pill svg { width: 12px; height: 12px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .pill.bucket[aria-pressed="true"] { background: var(--pill); border-color: var(--pill); color: #14130b; }
  .pill.bucket[aria-pressed="true"] .dot { background: #14130b; opacity: 0.55; }
  .pill.bucket[aria-pressed="true"] .n { color: #14130b; opacity: 0.75; }
  .pill.narrow[aria-pressed="true"] { background: #1c2a22; border-color: var(--accent-2); color: var(--accent-2); }
  .pill.narrow[aria-pressed="true"] .n { color: var(--accent-2); opacity: 0.8; }
  .pill.view[aria-pressed="true"] { background: #2a2410; border-color: var(--accent); color: #ffe08a; }
  .pill.clear { border-style: dashed; color: var(--muted); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-bottom: 6px; }
  .toolbar label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; display: inline-flex; align-items: center; gap: 5px; }
  select, input[type="search"] {
    background: var(--bg-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 7px; font: inherit; font-size: 12px;
  }
  input[type="search"] { min-width: 200px; }
  .sorts { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-left: auto; }
  .sorts button {
    appearance: none; border: 1px solid var(--line); background: var(--bg-3);
    color: var(--ink); padding: 3px 8px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px;
  }
  .sorts button.active { border-color: var(--accent-2); color: var(--accent-2); }
  .meta { color: var(--muted); font-size: 12px; margin: 4px 0 0; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  .meta-actions { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .meta-actions label { text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .ghost {
    appearance: none; border: 1px solid var(--line); background: var(--bg-3);
    color: var(--ink); padding: 3px 9px; border-radius: 6px; cursor: pointer;
    font: inherit; font-size: 12px; white-space: nowrap;
  }
  .ghost:hover, .ghost:focus-visible { border-color: var(--accent); color: #ffe08a; }
  .ghost.copied { border-color: var(--adopt); color: var(--adopt); background: #1c2a22; }
  main { padding: 16px 28px 80px; }
  .row {
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px 10px; margin: 0 0 8px;
  }
  .row.done { opacity: 0.55; }
  .row.done .title { text-decoration: line-through; }
  .row-top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; }
  .id a { font-weight: 650; text-decoration: none; font-variant-numeric: tabular-nums; }
  .kind { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .title { flex: 1 1 280px; font-weight: 550; }
  .triage {
    font-size: 12px; font-weight: 650; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); white-space: nowrap;
  }
  .triage.merge-now { color: #1b1404; background: var(--merge); border-color: var(--merge); }
  .triage.adopt { color: #10241c; background: var(--adopt); border-color: var(--adopt); }
  .triage.review { color: #0e1728; background: var(--review); border-color: var(--review); }
  .triage.discuss { color: #1d1024; background: var(--discuss); border-color: var(--discuss); }
  .triage.cleanup { color: #241a0c; background: var(--cleanup); border-color: var(--cleanup); }
  .triage.reject { color: #2a100c; background: var(--reject); border-color: var(--reject); }
  .triage.bulk { color: var(--ink); background: #3a382e; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 6px; }
  .tag {
    font-size: 11px; padding: 2px 7px; border-radius: 4px; background: var(--chip);
    color: #d9d2b8; border: 1px solid #3d4233;
  }
  .tag.upstream-label { background: transparent; border-color: var(--review); color: var(--review); }
  .tag.strengthens-privacy { color: #b8f0d4; border-color: #3d6b55; }
  .tag.impacts-privacy { color: #ffc9b8; border-color: #6b3d33; }
  .tag.posthog-backed, .tag.posthog-shipped { color: #b8e0ff; border-color: #33556b; }
  .tag.approved { color: #1b1404; background: var(--merge); border-color: var(--merge); }
  .tag.change { color: #10241c; background: var(--accent-2); border-color: var(--accent-2); font-weight: 650; }
  .sub { color: var(--muted); font-size: 12px; }
  .grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; margin-top: 8px;
  }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } header.page, main { padding-left: 14px; padding-right: 14px; } .flabel { width: 100%; flex-basis: 100%; } .sorts { margin-left: 0; } }
  .cell h3 {
    margin: 0 0 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); font-weight: 650;
  }
  .cell p { margin: 0; color: #e6e0cf; }
  .cell.empty p { color: #6d6858; font-style: italic; }
  .related a { margin-right: 8px; }
  .ev-links { margin: 6px 0 0; padding-left: 18px; }
  .ev-links li { margin: 0 0 4px; }
  .ev-links a { font-weight: 550; }
  .empty-board { color: var(--muted); padding: 40px 8px; }
  .msg { position: relative; display: inline-flex; }
  .copy-msg {
    appearance: none; border: 1px solid var(--line); background: var(--bg-3);
    color: var(--ink); padding: 3px 9px; border-radius: 6px; cursor: pointer;
    font: inherit; font-size: 12px; white-space: nowrap;
  }
  .copy-msg:hover, .copy-msg:focus-visible,
  .mark-done:hover, .mark-done:focus-visible {
    border-color: var(--accent); color: #ffe08a;
  }
  .copy-msg.copied { border-color: var(--adopt); color: var(--adopt); background: #1c2a22; }
  .mark-done.done-on { border-color: var(--reject); color: #ffc9b8; }
  .row-actions { margin-left: auto; display: inline-flex; gap: 6px; align-items: center; }
  .msg:has(.copy-msg.copied) .msg-tip { display: none; }
  .msg-tip {
    display: none; position: absolute; right: 0; top: calc(100% + 6px);
    z-index: 40; width: min(440px, 78vw); background: #2a2718;
    border: 1px solid var(--accent); color: var(--ink); padding: 10px 12px;
    border-radius: 8px; white-space: pre-wrap; font-size: 12px; line-height: 1.45;
    box-shadow: 0 10px 28px rgba(0,0,0,0.45);
  }
  .msg:hover .msg-tip, .msg:focus-within .msg-tip { display: block; }
</style>
</head>

<header class="page">
  <h1>rrweb-io/rrweb intake triage</h1>
  <p class="lede">

 and configurable: true, which is a no-op on merging engines. Unit tests model the Xray case, and a changeset is included. main still has the bare setter descriptor.", "notes": "", "downstream": "", "downstreamLinks": [], "related": [], "message": "This looks small and correct enough to adopt after rebase + green CI. Approving.\n\nhookSetter defines a descriptor with only a setter; Firefox Xray wrappers in extension content scripts do not merge descriptors, so input.value and checked read undefined while recording and after stop(). The PR passes the original getter and configurable: true, which is a no-op on merging engines. Unit tests model the Xray case, and a changeset is included. main still has the bare setter descriptor.", "additions": 79, "deletions": 0, "changedFiles": 3, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": null, "movedFrom": null}, {"id": 1949, "kind": "pr", "title": "fix(rrweb-snapshot): capture and rebuild adoptedStyleSheets", "url": "https://github.com/rrweb-io/rrweb/pull/1949", "author": "Ramshankar-Chellappa", "authorName": "Ramshankar-Chellappa", "createdAt": "2026-09-25T07:48:34Z", "updatedAt": "2026-09-25T12:07:32Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "community", "whoLabel": "Community", "triage": "discuss", "tags": ["community", "waiting-on-review"], "next": "Team meeting: decide whether constructed stylesheets belong in the full snapshot format or stay on the incremental path.", "reason": "Makes rrweb-snapshot capture document and shadow-root adoptedStyleSheets into a new adoptedStyleSheets field on serializedNode and rebuild them, for direct rrweb-snapshot users (issue 1567, open since 2024). It changes the shared snapshot format in @rrweb/types and duplicates the AdoptedStyleSheet incremental path rrweb already uses, which Eoghan's 1987 and 1641 also touch. Format changes need the team.", "notes": "", "downstream": "", "downstreamLinks": [], "related": [1567, 1987, 1641], "message": "Holding onse, with tests, README, recipe and changeset. The author pinged Justin on 2026-09-16 with no reply. Adding plugins to the monorepo and the shape of the events are plugin-direction questions for the team.", "notes": "", "downstream": "", "downstreamLinks": [], "related": [], "message": "Holding this for a team discussion rather than merging or closing from the thread.\n\nAdds two new plugin packages (popup-record and popup-replay) that record window.alert, confirm and prompt calls and the user's response, with tests, README, recipe and changeset. The author pinged Justin on 2026-09-16 with no reply. Adding plugins to the monorepo and the shape of the events are plugin-direction questions for the team.", "additions": 1067, "deletions": 0, "changedFiles": 16, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": null, "movedFrom": null}, {"id": 1897, "kind": "pr", "title": "feat(rrweb-snapshot): support more user-action pseudo-classes for rebuild", "url": "https://github.com/rrweb-io/rrweb/pull/1897", "author": "hi-ogawa", "authorName": "Hiroshi Ogawa", "createdAt": "2026-07-02T04:35:08Z", "updatedAt": "2026-09-16T06:25:40Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "community", "whoLabel": "Community", "triage": "review", "tags": ["community", "waiting-on-review"], "next": "Eoghan: review and answer the option-shape question (separate option vs extending hackCss).", "reason": "Adds an opt-in hackCssPseudoClasses option to rebuild so :active, :focus, :focus-visible and :focus-within are mirrored as classes like :hover (issue 1896, open). Defaults keep current behaviour, has css and integration tests plus a changeset, rebased 2026-09-16. The author asked which option shape the maintainers prefer; no maintainer has answered.", "notes": "", "downstream": "", "downstreamLinks": [], "related": [1896], "message": "Could someone from core take a look at this? It’s a focused change, not a product-strategy fork.\n\nAdds an opt-in hackCssPseudoCla es."}, {"label": "PostHog/posthog-js#3766", "url": "https://github.com/PostHog/posthog-js/issues/3766", "note": "They plan review comments on shadow-root plumbing and an empty-array guard."}], "related": [1933], "message": "Thanks for the detailed numbers. We're leaning towards not adding attributeFilter as a record option: any filter stops us seeing newly added attributes, and that gap is hard to document safely. Could you try #1933's per-element throttling on your noisiest site and share CPU numbers? If that covers your case we'll close this one.", "additions": 47, "deletions": 2, "changedFiles": 4, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": null, "movedFrom": null}, {"id": 1861, "kind": "pr", "title": "[browser-client] add sequence id plugin", "url": "https://github.com/rrweb-io/rrweb/pull/1861", "author": "Juice10", "authorName": "Justin Halsall", "createdAt": "2026-06-03T13:37:44Z", "updatedAt": "2026-06-08T08:41:24Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "maintainer", "whoLabel": "Justin", "triage": "review", "tags": ["commercial", "maintainer", "waiting-on-review", "bulk-updated"], "next": "Eoghan: review the browser-client and plugin changes.", "reason": "Justin adds a browser-client-managed sequenceId to every event sent to rrweb Cloud, persisted in sessionStorage per recording id, and extends the sequential-id record plugin to resume from a given id. Copilot's points (changeset split, best-effort storage, recording-scoped start token) were addressed on 2026-06-05. No maintainer review yet; 2370 lines including spec and plan docs.", "notes": "", "downstream": "", "downstreamLinks": [], "related": [], "message": "Could someone from core take a look at this? It’s a focused change, not a product-strategy fork.\n\nJustin adds a browser-client-managed sequenceId to every event sent to rrweb Cloud, persisted in sessionStorage per recording id, and extends the sequential-id record plugin to resume from a given id. Copil main and on fork PRs origin is the fork (Copilot flagged this on 2026-06-01).\n\nJustin: rebase, drop the lockfile bump, and fetch main from the upstream repo before running changeset status.", "additions": 225, "deletions": 865, "changedFiles": 5, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": null, "movedFrom": null}, {"id": 1810, "kind": "pr", "title": "[build] Keep annotate job green on lint findings", "url": "https://github.com/rrweb-io/rrweb/pull/1810", "author": "Juice10", "authorName": "Justin Halsall", "createdAt": "2026-03-19T15:54:46Z", "updatedAt": "2026-06-08T08:41:22Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "maintainer", "whoLabel": "Justin", "triage": "adopt", "tags": ["maintainer", "waiting-on-review", "bulk-updated"], "next": "Justin: rebase the one-liner and merge.", "reason": "Justin's one-line CI change sets fail-on-error: false on the eslint-annotate step of the privileged workflow so lint findings stop painting the relay job red while the ESLint Report Analysis check still fails on real errors. Main does not have the setting yet; the file moved since so it needs a trivial rebase.", "notes": "", "downstream": "", "downstreamLinks": [], "related": [], "message": "This looks small and correct enough to adopt after rebase + green CI. Approving.\n\nJustin's one-line CI change sets fail-on-error: false on the eslint-annotate step of the privileged workflow so lint findings stop painting the relay job red while the ESLint Report Analysis check still fails on real errors. Main does not have the setting yet; the file moved since so it needs a trivial rebase.", "additions": 1, "deletions": 0, "changedFiles": 1, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": "moved", "movedFrom": "cleanup"}, {"id": 1802, "kind": "pr", "title": "fix: treat querySelector/querySelectorAll as methods in untainted pro…", "url": "https://github.com/rrweb-io/rrweb/pull/1802", "author": "juliecheng", "authorName": "juliech w", "bulk-updated", "mixpanel-backed"], "next": "Justin: close pointing at 1673.", "reason": "Guards MediaInteraction replay against non AUDIO/VIDEO targets (lottie player pause). Duplicate of Justin's 1462 and covered by 1673, merged 2026-10-26, which wraps play/pause in try/catch so the replay no longer throws. Verified 2026-11-06: main's record handler drops non-media targets and the replayer catches play/pause errors, so this guard would only change a warning into a debug message.", "notes": "", "downstream": "Mixpanel rrweb 10 cites this PR as the upstream they shipped.", "downstreamLinks": [{"label": "mixpanel/rrweb#10", "url": "https://github.com/mixpanel/rrweb/pull/10", "note": "They shipped this weaker duplicate and cited it as the upstream. Prefer 1688 + 1673."}], "related": [1462], "message": "Closing: #1673 merged on 2026-10-26 and makes the replayer safe against play/pause on a non-media target, and #1688 carries the record-side guard. Thanks for the report and the patch.", "additions": 4, "deletions": 1, "changedFiles": 2, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": null, "movedFrom": null}, {"id": 1796, "kind": "pr", "title": "fix(replay): preserve class attribute text in hoverElements to avoid breaking CSS attribute selectors", "url": "https://github.com/rrweb-io/rrweb/pull/1796", "author": "alailsonko", "authorName": "Alailson", "createdAt": "2026-03-04T11:43:02Z", "updatedAt": "2026-06-08T08:41:22Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "community", "whoLabel": "Community", "triage": "adopt", "tags": ["community", "waiting-on-review", "bulk-updated"], "next": "Eoghan: review, add an @rrweb/replay patch changeset, merge.", "reason": "Replayer hover simulation used classList, which deduplicates class tokens and breaks attribute selectors like [class*=\"center aligned\"]; the fix sets the class attribute text directly. Small replay-only change with a fixture and a puppeteer test, Copilot nits addressed the s ath. 1934 edits the same function and should rebase after.", "notes": "", "downstream": "Already in PostHog's fork.", "downstreamLinks": [{"label": "PostHog/posthog-js#3765", "url": "https://github.com/PostHog/posthog-js/issues/3765", "note": "Listed as already in their vendored rrweb (verified by them, not re-verified here)."}], "related": [1627, 1934], "message": "Review is already done. Merging this onto current `main`.\n\nRemoves the temporary iframe in getUntaintedPrototype when contentWindow is null or the lookup throws; fixes #1627 with a changeset. Approved on 2026-10-28 by kevinvandijk (write access) and merged with main the same day. main still leaks the iframe on the throw path. 1934 edits the same function and should rebase after.", "additions": 14, "deletions": 3, "changedFiles": 2, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": "moved", "movedFrom": "adopt"}, {"id": 1768, "kind": "pr", "title": "Fix timeout calculation to account for event duration and playback speed", "url": "https://github.com/rrweb-io/rrweb/pull/1768", "author": "app/copilot-swe-agent", "authorName": "app/copilot-swe-agent", "createdAt": "2026-01-02T10:29:00Z", "updatedAt": "2026-06-08T08:41:21Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "community", "whoLabel": "Community", "triage": "reject", "tags": ["community", "waiting-on-review", "bulk-updated"], "next": "Justin: close as already merged via 1762.", "reason": "Copilot sub-PR of 1762 that makes the rrvideo replay timeout scale with event duration and playback speed. 1762 merged on 2026-02-06 and main's rrvideo already computes expectedPlaybackTime plus a two-minute buffer, so this is landed. Branch is CONFLICTING and carries 27 files of stale 1762 history.", "notes": "", "downstream": "", "downstreamLinks": [], "related": [], "message": "Closing this pull request as part of intake cleanup.\n\nCopilot sub-PR of 1762 that makes the rrvideo replay timeout scale with event duration and playback , and add a regression test for the reported case. If that doesn’t happen in two weeks we’ll close it; open a new PR if this is still relevant.\n\nAdds a csp player option that sets the csp attribute on the replay iframe. That attribute is Chrome-only and gives a false sense of security elsewhere. Justin asked on 2026-01-02 for documentation of the limitation and guide entries; no reply in ten months. No test, and the branch conflicts.", "additions": 9, "deletions": 2, "changedFiles": 2, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": null, "movedFrom": null}, {"id": 1748, "kind": "pr", "title": "fix: Fix broken links in README.md", "url": "https://github.com/rrweb-io/rrweb/pull/1748", "author": "metal-messiah", "authorName": "Jordan Porter", "createdAt": "2025-10-08T17:47:41Z", "updatedAt": "2026-06-08T08:41:21Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "community", "whoLabel": "Community", "triage": "review", "tags": ["community", "waiting-on-review", "bulk-updated"], "next": "Justin: answer the author; either merge this root README fix or ask for the package.json repository link change instead.", "reason": "Rewrites eight relative links in the root README to absolute github.com URLs so they work on npm. Justin replied on 2025-11-19 that every package README has the same problem and suggested fixing the npm repository link instead; the author asked on 2025-12-02 whether to do that here or in a new PR and has had no answer.", "notes": "", "downstream": "", "downstreamLinks": [], "related": [], "message": "Could someone from core take a look at this? It’s a focused change, not a product-strategy fork.\n\nRewrites eight relative links in the root README to absolute github.com URLs so they work on npm. Justin replied on 2025-11-19 that every package README has the same problem and suggested fixing the npm repository link instead; the author asked on 2025-12-02 whether to do that here or in a new PR and has had no answer.\n\nJustin: t the flag and naming. 1991 replaces the single switch with collectFromOrigins and emitToOrigin, which covers this nested case with origin scoping. Verified 2026-11-06: under 1991 a middle frame that sets collectFromOrigins without emitToOrigin emits locally and collects from its children, which is exactly this flag's case.", "notes": "", "downstream": "", "downstreamLinks": [], "related": [1991], "message": "Closing in favor of #1991, which covers the same ground. Please move any extra test cases there.\n\nAdds an emitFromIframe flag so a middle iframe can emit locally while collecting from child iframes. Proof of concept with no tests; pauldambra and Justin (2025-09-05) asked for tests and were unsure about the flag and naming. 1991 replaces the single switch with collectFromOrigins and emitToOrigin, which covers this nested case with origin scoping. Verified 2026-11-06: under 1991 a middle frame that sets collectFromOrigins without emitToOrigin emits locally and collects from its children, which is exactly this flag's case.\n\nIf this is still relevant, please open a new PR against current `main` with a rebase, a changeset, and a regression test. We’re closing stale work so intake can restart.", "additions": 5, "deletions": 1, "changedFiles": 2, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": "moved", "movedFrom": "review"}, {"id": 1722, "kind": "pr", "title": "refactor(rrweb/scripts/repl.js): 增强录制脚本注入的鲁棒性与安全性", "url": "https://github.com/rrweb-io/rrweb/pull/1722", "author": "zqsds", "authorName": "Zhao Xu Kun", "createdAt": "2025-08-04T02:41:59Z", "updatedAt": "2026-06-08T08:41:20Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "community", "whoLabel": "Community", "triage": "reject", "tags": ["community", "waiting-on-review", "bulk-updated"], "next": "Eoghan: close; invite a narrower PR if a specific repl failure can be shown.", "reason": "Rewrites the dev-only repl.js injection with a single debounced timer across all frames, a  answered the same day (Dark Reader extension). Has a changeset.", "notes": "", "downstream": "", "downstreamLinks": [], "related": [], "message": "Could someone from core take a look at this? It’s a focused change, not a product-strategy fork.\n\nIn rrdom diffChildren, a mismatched node type replaced the old child and lost its nextSibling, so the loop ended early and dropped later siblings and styles. The PR inserts the new node before the old child instead and keeps the loop going, with a diff test. Eoghan asked for the real-world scenario on 2025-09-05 and the author answered the same day (Dark Reader extension). Has a changeset.\n\nEoghan: re-review now that the motivating scenario is explained.", "additions": 95, "deletions": 0, "changedFiles": 3, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": null, "movedFrom": null}, {"id": 1711, "kind": "pr", "title": "fix(rrweb-snapshot): inserting doctype element", "url": "https://github.com/rrweb-io/rrweb/pull/1711", "author": "JonaszJestem", "authorName": "Jonasz Wiącek", "createdAt": "2025-07-01T11:23:51Z", "updatedAt": "2026-06-08T08:41:20Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "community", "whoLabel": "Community", "triage": "cleanup", "tags": ["posthog-backed", "community", "waiting-on-review", "bulk-updated"], "next": "Author: answer Eoghan's 2025-07-04 question with a real recording or the record-time cause.", "reason": "Makes rebuild insert a DocumentType node before an existing root element instead of appending it, with a unit test and changeset, to avoid HierarchyRequestError during replay. Eoghan asked on 2025-07-04 whether the out-of-order doctype in the test is a real recording or synthetic, since the real fix might belong at record time; the author never answered.", "notes": "", "downstream": "Already in PostHog's fork.", "downstreamLinks": [{"label": "PostHog/posthog-js#3765", "url": "https://github.com/PostHog/posthog-js/issues/3765", "note": "Listed as already in their vendored rrweb (verified by them, not re-verified here)."}], "related": [], "message": "Thanks for this — the direction looks useful. Before we can review it on current `main`, please rebase, add a changeset, and add a regression test for the reported case. If that doesn’t happen in two weeks we’ll close it; open a new PR if this is still relevant.\n\nMakes rebuild insert a DocumentType node before an existing root element instead of appending it, with a unit test and changeset, to avoid HierarchyRequestError during replay. Eoghan asked on 2025-07-04 whether the out-of-order doctype in the test is a real recording or synthetic, since the real fix might belong at record time; the author never answered.", "additions": 111, "deletions": 0, "changedFiles": 3, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": "moved", "movedFrom": "adopt"}, {"id": 1709, "kind": "pr", "title": "Optimized the user guide", "url": "https://github.com/rrweb-io/rrweb/pull/1709", "author": "Juntao666", "authorName": "Juntao666", "createdAt": "2025-06-25T03:40:23Z", "updatedAt": "2026-06-08T08:41:19Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "community", "whoLabel": "Community", "triage": "reject", "tags": ["community", "waiting-on-review", "bulk-updated"], "next": "Eoghan: close with a note that 1704 fixed the CDN links.", "reason": "Renames the guide's install sections to Option 1/2 and tells readers to fall back to the rrweb@1.1.3 CDN build because the 2.x links did not work. Eoghan noted on 2025-06-26 that the guide would be fixed by 1704 (umd folder), which merged 2026-02-13 and restored the CDN paths, so the fallback advice is now wrong.", "notes": "", "downstream": "", "downstreamLinks": [], "related": [], "message": "Closing this pull request as part of intake cleanup.\n\nRenames the guide's install sections to Option 1/2 and tells readers to fall back to the rrweb@1.1.3 CDN build because the 2.x links did not work. Eoghan noted on 2025-06-26 that the guide would be fixed by 1704 (umd folder), which merged 2026-02-13 and restored the CDN paths, so the fallback advice is now wrong.\n\nIf this is still relevant, please open a new PR against current `main` with a rebase, a changeset, and a regression test. We’re closing stale work so intake can restart.", "additions": 26, "deletions": 4, "changedFiles": 3, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": "moved", "movedFrom": "cleanup"}, {"id": 1697, "kind": "pr", "title": "Don't allow video autoplay to automatically unfreeze page", "url": "https://github.com/rrweb-io/rrweb/pull/1697", "author": "eoghanmurray", "authorName": "Eoghan Murray", "createdAt": "2025-05-28T14:30:58Z", "updatedAt": "2026-06-08T08:41:19Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "maintainer", "whoLabel": "Eoghan", "triage": "review", "tags": ["posthog-backed", "posthog-shipped", "maintainer", "waiting-on-review", "bulk-updated"], "next": "Justin: review the new exempt list and merge; ask for a test if the freeze semantics worry you.", "reason": "Eoghan's small recorder change with a changeset: when the page is frozen, MediaInteraction, StyleSheetRule, CanvasMutation, Font, Log, StyleDeclaration and AdoptedStyleSheet events no longer count as user activity that unfreezes it, so a looping background video cannot defeat freezing. Main still only exempts Mutation, so the merged 1673 (replay-side media safety) does not cover this. No test.", "notes": "", "downstream": "Shipped in posthog-js 4131 (near-verbatim plus a Set hoist). Checkout timers can still unfreeze.", "downstreamLinks": [{"label": "PostHog/posthog-js#4131", "url": "https://github.com/PostHog/posthog-js/pull/4131", "note": "Shipped adopt of this PR (plus a Set hoist). Checkout timers can still unfreeze."}], "related": [], "message": "Could someone from core take a look at this? It’s a focused change, not a product-strategy fork.\n\nEoghan's small recorder change with a changeset: when the page is frozen, MediaInteraction, StyleSheetRule, CanvasMutation, Font, Log, StyleDeclaration and AdoptedStyleSheet events no longer count as user activity that unfreezes it, so a looping background video cannot defeat freezing. Main still only exempts Mutation, so the merged 1673 (replay-side media safety) does not cover this. No test.\n\nJustin: review the new exempt list and merge; ask for a test if the freeze semantics worry you.", "additions": 15, "deletions": 1, "changedFiles": 2, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": "moved", "movedFrom": "adopt"}, {"id": 1691, "kind": "pr", "title": "fix: skip calling setAttribute on unchanged attr in diffProps", "url": "https://github.com/rrweb-io/rrweb/pull/1691", "author": "juliecheng", "authorName": "juliecheng", "createdAt": "2025-05-15T17:14:58Z", "updatedAt": "2026-06-08T08:41:19Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "community", "whoLabel": "Community", "triage": "adopt", "tags": ["posthog-backed", "community", "waiting-on-review", "bulk-updated", "grafana-backed"], "next": "Yun: review and merge.", "reason": "rrdom diffProps skips setAttribute when the attribute already has that value, because Chrome drops insertRule rules when type=text/css is re-set on a style element. Comes with a rrdom unit test, a replayer test and a changeset. main still calls setAttribute unconditionally. No review yet since 2025-05-15.", "notes": "", "downstream": "Already in PostHog's fork. Grafana independently re-implemented the same skip-unchanged setAttribute in rrdom (grafana/rrweb 31).", "downstreamLinks": [{"label": "PostHog/posthog-js#3765", "url": "https://github.com/PostHog/posthog-js/issues/3765", "note": "Listed as already in their vendored rrweb (verified by them, not re-verified here)."}, {"label": "grafana/rrweb#31", "url": "https://github.com/grafana/rrweb/pull/31", "note": "Independent re-implementation of skip-unchanged setAttribute in rrdom diffProps (plus SVG NS + iframe src coverage). Open on their fork."}], "related": [], "message": "This looks small and correct enough to adopt after rebase + green CI. Approving.\n\nrrdom diffProps skips setAttribute when the attribute already has that value, because Chrome drops insertRule rules when type=text/css is re-set on a style element. Comes with a rrdom unit test, a replayer test and a changeset. main still calls setAttribute unconditionally. No review yet since 2025-05-15.", "additions": 208, "deletions": 1, "changedFiles": 5, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": null, "movedFrom": null}, {"id": 1688, "kind": "pr", "title": "fix: prevent invalid media processing", "url": "https://github.com/rrweb-io/rrweb/pull/1688", "author": "juliecheng", "authorName": "juliecheng", "createdAt": "2025-04-25T19:55:08Z", "updatedAt": "2026-10-26T10:42:28Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "community", "whoLabel": "Community", "triage": "reject", "tags": ["posthog-backed", "community", "waiting-on-review", "mixpanel-backed"], "next": "Eoghan: close with thanks, pointing to merged 1673 and the blocking work for the blocked-media case.", "reason": "Guards MediaInteraction replay against non-media targets and skips blocked media elements. Eoghan said on 2026-10-26 that 1673 covers the replay crash and 1673 merged the same day with try/catch around pause and play in the media manager. He routed the remaining idea (not emitting media events for blocked elements) to the blockClass/blockSelector work. Verified 2026-11-06: main's record handler already drops events whose target is not an HTMLMediaElement, and the replayer wraps play and pause in try/catch, so both halves are covered.", "notes": "", "downstream": "Already in PostHog's fork. Mixpanel shipped the same MediaInteraction guard (their write-up cites 1798).", "downstreamLinks": [{"label": "PostHog/posthog-js#3765", "url": "https://github.com/PostHog/posthog-js/issues/3765", "note": "Listed as already lated": [], "message": "Holding this for a team discussion rather than merging or closing from the thread.\n\nAdds a blockElementFn callback so consumers can whitelist or block elements by arbitrary logic, with a changeset and tests. Labeled privacy. Eoghan asked on 2026-11-06 for a concrete use case and production evidence because the callback cannot be optimized like a selector. Branch is CONFLICTING.", "additions": 219, "deletions": 25, "changedFiles": 14, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": null, "movedFrom": null}, {"id": 1641, "kind": "pr", "title": "fix: preserve adopted styles from nodes being removed when virtual dom is in use", "url": "https://github.com/rrweb-io/rrweb/pull/1641", "author": "megboehlert", "authorName": "Meg Boehlert", "createdAt": "2025-01-31T03:55:29Z", "updatedAt": "2026-06-08T08:41:18Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "community", "whoLabel": "Community", "triage": "review", "tags": ["posthog-nudge", "community", "waiting-on-review", "bulk-updated", "amplitude-backed"], "next": "Yun: review the replayer styleMap logic.", "reason": "With virtual DOM, node removals run before adopted stylesheets are applied, so styles owned by a removed node are never stored and a later node that adopts them is unstyled. The PR caches the missed styles in a styleMap and applies them when a styleId is requested. Has a changeset, an event fixture and a replayer test; the types change is only a type alias extraction. Never reviewed.", "notes": "", "downstream": "PostHog wants tests. Amplitude shipped inline adoptedStyleSheets in the full snapshot (101) and has a mutation-add follow-up open (133).", "downstreamLinks": [{"label": "PostHog/posthog-js#3765", "url": "https://github.com/PostHog/posthog-js/issues/3765", "note": "On their own-open / nudge list — needs tests or a cluster decision."}, {"label": "amplitude/rrweb#101", "url": "https://github.com/amplitude/rrweb/pull/101", "note": "Shipped inline adoptedStyleSheets in the full snapshot so dropped incremental style events cannot leave shadow CSS empty."}, {"label": "amplitude/rrweb#133", "url": "https://github.com/amplitude/rrweb/pull/133", "note": "Follow-up: inline adoptedStyleSheets on mutation add as well. Open."}], "related": [], "message": "Could someone from core take a look at this? It’s a focused change, not a product-strategy fork.\n\nWith virtual DOM, node removals run before adopted stylesheets are applied, so styles owned by a removed node are never stored and a later node that adopts them is unstyled. The PR caches the missed styles in a styleMap and applies them when a styleId is requested. Has a changeset, an event fixture and a replayer test; the types change is only a type alias extraction. Never reviewed.\n\nYun: review the replayer styleMap logic.", "additions": 238, "deletions": 7, "changedFiles": 5, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": null, "movedFrom": null}, {"id": 1638, "kind": "pr", "title": "update record and playback to account for parent node missing when it…", "url": "https://github.com/rrweb-io/rrweb/pull/1638", "author": "mikeyagner", "authorName": "mikeyagner", "createdAt": "2025-01-27T15:40:45Z", "updatedAt": "2026-06-08T08:41:18Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "community", "whoLabel": "Community", "triage": "cleanup", "tags": ["community", "waiting-on-review", "bulk-updated"], "next": "Author: rebase onto main, add a test that reproduces the missing-parent case, and compute the id set once per batch.", "reason": "Changes movedSet handling in the recorder so a moved node whose parent is in addedSet is not skipped, and makes the replayer keep resolve trees whose parent id is about to be added in the same batch. The title says tests will be added later and none were; the replay helper recomputes the full id set once per tree inside the loop. 1652 (merged 2026-09-17) and 1988 rework the same addedSet code, so the recorder change needs re-checking on main.", "notes": "", "downstream": "", "downstreamLinks": [], "related": [1988], "message": "Thanks for this — the direction looks useful. Before we can review it on current `main`, please rebase, add a changeset, and add a regression test for the reported case. If that doesn’t happen in two weeks we’ll close it; open a new PR if this is still relevant.\n\nChanges movedSet handling in the recorder so a moved node whose parent is in addedSet is not skipped, and makes the replayer keep resolve trees whose parent id is about to be added in the same batch. The title says tests will be added later and none were; the replay helper recomputes the full id set once per tree inside the loop. 1652 (merged 2026-09-17) and 1988 rework the same addedSet code, so the recorder change needs re-checking on main.", "additions": 24, "deletions": 3, "changedFiles": 4, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": "moved", "movedFrom": "review"}, {"id": 1635, "kind": "pr", "title": "fix for loading iframes with custom web components in chrome", "url": "https://github.com/rrweb-io/rrweb/pull/1635", "author": "megboehlert", "authorName": "Meg Boehlert", "createdAt": "2025-01-22T14:19:59Z", "updatedAt": "2026-06-08T08:41:18Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "community", "whoLabel": "Community", "triage": "cleanup", "tags": ["posthog-nudge", "community", "waiting-on-review", "bulk-updated"], "next": "Author: add a snapshot test for an iframe that defines a custom element in its body, explain the dropped src === '' case, and make the changeset a patch.", "reason": "Changes the Chrome blank-frame check in onceIframeLoaded so iframes whose custom elements are defined in the body get serialised; main still has the old condition. The 10-line change also drops the src === '' branch and gates on readyState, with only videos as evidence and no test. Changeset marks rrweb-snapshot as minor for a fix.", "notes": "", "downst gression test. We’re closing stale work so intake can restart.", "additions": 142, "deletions": 29, "changedFiles": 6, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": null, "movedFrom": null}, {"id": 1586, "kind": "pr", "title": "Fix chrome grid template", "url": "https://github.com/rrweb-io/rrweb/pull/1586", "author": "jaj1014", "authorName": "Alex Jackson", "createdAt": "2024-10-21T17:26:44Z", "updatedAt": "2026-06-08T08:41:18Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "community", "whoLabel": "Community", "triage": "review", "tags": ["community", "waiting-on-review", "bulk-updated", "amplitude-backed"], "next": "Eoghan: decide whether the supported Chrome range still needs the workaround; close if not, otherwise review.", "reason": "Adds replaceChromeGridTemplateAreas to rebuild grid-template-areas from rule.style when Chrome's cssText drops rows (Chromium bug 40227336). Replaces the closed regex PR 1396, has a changeset and unit tests, and has never been reviewed. main has no grid handling, so nothing merged covers it. Whether the Chromium bug is still live was not checked. Verified 2026-11-06: Chrome 152 serializes grid-template-areas, repeat() rows and the grid-template shorthand correctly, so the bug this works around is fixed in current Chrome; the value depends on how old a Chrome the team still supports.", "notes": "", "downstream": "Amplitude rrweb 126 (unmerged) serializes grid-template-areas faithfully.", "downstreamLinks": [{"label": "amplitude/rrweb#126", "url": "https://github.com/amplitude/rrweb/pull/126", "note": "Serialize grid-template-areas faithfully (mobile replay overlap). Same Chrome grid-template hole. Open, not merged."}], "related": [], "message": "Could someone from core take a look at this? It’s a focused change, not a product-strategy fork.\n\nAdds replaceChromeGridTemplateAreas to rebuild grid-template-areas from rule.style when Chrome's cssText drops rows (Chromium bug 40227336). Replaces the closed regex PR 1396, has a changeset and unit tests, and has never been reviewed. main has no grid handling, so nothing merged covers it. Whether the Chromium bug is still live was not checked. Verified 2026-11-06: Chrome 152 serializes grid-template-areas, repeat() rows and the grid-template shorthand correctly, so the bug this works around is fixed in current Chrome; the value depends on how old a Chrome the team still supports.\n\nEoghan: decide whether the supported Chrome range still needs the workaround; close if not, otherwise review.", "additions": 141, "deletions": 4, "changedFiles": 3, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": null, "movedFrom": null}, {"id": 1534, "kind": "pr", "title": "Export `isBlocked` alongside rrweb.record", "url": "https://github.com/rrweb-io/rrweb/pull/1534", "author": "eoghanmurray", "authorName": "Eoghan Murray", "createdAt": "2024-07-12T14:38:58Z", "updatedAt": "2026-06-08T08:41:17Z", "draft": true, "reviewDecision": "REVIEW_REQUIRED", "who": "maintainer", "whoLabel": "Eoghan", "triage": "reject", "tags": ["privacy-overlap", "maintainer-close", "maintainer", "draft", "bulk-updated"], "next": "Eoghan: close the draft and carry the public isBlocked requirement into the privacy-at-capture API discussion.", "reason": "Eoghan's 2024 speculative draft wraps record in packages/record to remember the options and exports a public isBlocked(node) built on them. The diff calls utils.isBlocked without importing utils, so it does not compile as-is, and Eoghan himself questioned whether record.utils should be exposed at all. Whether and how to expose a blocking predicate belongs to the privacy policy API design.", "notes": "", "downstream": "", "downstreamLinks": [], "related": [], "message": "Closing this stale pull request as part of intake cleanup.\n\nEoghan's 2024 speculative draft wraps record in packages/record to remember the options and exports a public isBlocked(node) built on them. The diff calls utils.isBlocked ": "", "downstreamLinks": [], "related": [], "message": "Thanks for this — the direction looks useful. Before we can review it on current `main`, please rebase, add a changeset, and add a regression test for the reported case. If that doesn’t happen in two weeks we’ll close it; open a new PR if this is still relevant.\n\nChanges throttle() to shallow-copy event args and clear a one-shot timeout, claiming scroll targets are lost on mobile smooth scrolling. Eoghan asked three times (2024-04-09 and 04-11) why the transformation is needed when the closure already holds args; the last question was never answered. The spread copies an Event into a plain object, which drops its prototype, and there is no test.", "additions": 11, "deletions": 2, "changedFiles": 1, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": null, "movedFrom": null}, {"id": 1428, "kind": "pr", "title": "support recording canvas in iframe and shadow dom", "url": "https://github.com/rrweb-io/rrweb/pull/1428", "author": "p-mazhnik", "authorName": "Pavel", "createdAt": "2024-03-15T10:25:03Z", "updatedAt": "2026-06-08T08:41:16Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "community", "whoLabel": "Community", "triage": "cleanup", "tags": ["community", "waiting-on-review", "bulk-updated"], "next": "Justin: decide whether to rebase 1428 onto the 2.2.0 canvas manager yourself or ask the author, and close 1413 and 1235 in its favour.", "reason": "Records canvas elements inside same-origin iframes and shadow DOM, with sampling all mode, ShadowDomManager integration and tests; resolves open issues 1081 and 1412 and is the most complete of three attempts (1413 and 1235 are the others). Only a community approval (okejminja, 2024-09-05); Justin is assigned but has not reviewed, users asked for progress in November 2024, and the author has been silent since April 2024. The 2.2.0 canvas manager rewrite and Justin's draft 1927 (iframe canvas drawImage) mean it needs a rebase before revie s already in their vendored rrweb (verified by them, not re-verified here)."}], "related": [1428, 1235], "message": "Closing in favor of #1428, which covers the same ground. Please move any extra test cases there.\n\nFixes open issue #1412: the canvas manager's rAF snapshotter only finds canvases with document.querySelectorAll, so canvases inside shadow roots are never captured. The PR walks every element's shadowRoot recursively. Main still has the document-only lookup, so nothing merged covers it. No test, no changeset, and the querySelectorAll('*') walk runs on every snapshot tick. Verified 2026-11-06: 1428 finds shadow-root canvases through the ShadowDomManager and iframe canvases through addWindow, with tests; this PR walks every element each tick and has no test.\n\nIf this is still relevant, please open a new PR against current `main` with a rebase, a changeset, and a regression test. We’re closing stale work so intake can restart.", "additions": 21, "deletions": 5, "changedFiles": 1, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": null, "movedFrom": null}, {"id": 1392, "kind": "pr", "title": "Fixes protocol URL regex", "url": "https://github.com/rrweb-io/rrweb/pull/1392", "author": "navaneethsdk", "authorName": "Navaneeth D", "createdAt": "2024-01-09T04:40:58Z", "updatedAt": "2026-06-08T08:41:16Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "community", "whoLabel": "Community", "triage": "adopt", "tags": ["community", "waiting-on-review", "bulk-updated"], "next": "Eoghan: re-apply the one-line change on main (URL_PROTOCOL_MATCH in rrweb-snapshot/src/utils.ts) and merge.", "reason": "One-character regex change so URL schemes with a hyphen (chrome-extension://) are recognised as absolute and not rewritten in stylesheets; fixes #1391, changeset included. Correct per RFC 3986 scheme syntax. The constant has since moved to rrweb-snapshot/src/utils.ts on main, so the patch needs re-applying there.", "notes": "", "downstream": "", ipped for a perf win when only selectors are used. Eoghan called it great on 2024-04-13 and asked for a rebase; the author rebased on 2024-05-01 and nobody looked again. Two-line change with a changeset, MERGEABLE, but the TypeScript types were not widened to accept null.\n\nEoghan: re-review; ask for the option types to accept null before merging.", "additions": 7, "deletions": 1, "changedFiles": 2, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": null, "movedFrom": null}, {"id": 1357, "kind": "pr", "title": "fix: inserted styles lost when moving elements", "url": "https://github.com/rrweb-io/rrweb/pull/1357", "author": "jaj1014", "authorName": "Alex Jackson", "createdAt": "2023-11-20T17:27:59Z", "updatedAt": "2026-06-08T08:41:16Z", "draft": false, "reviewDecision": "CHANGES_REQUESTED", "who": "community", "whoLabel": "Community", "triage": "cleanup", "tags": ["community", "changes-requested", "bulk-updated"], "next": "Author: push a clean branch with only the insertBefore fix, switch innerText to textContent, then ask Yun to review the rrdom approach.", "reason": "Fixes CSSStyleSheet.insertRule() styles being lost when the rrdom diff moves a style element (issue 1344). Eoghan requested changes on 2024-05-08: the branch picked up unrelated commits and eslint fails. The author promised a clean branch but never pushed it, and billyvg reported a differ perf regression from innerText reflow (2025-01-06). Yun was asked to judge the rrdom approach and has not.", "notes": "", "downstream": "", "downstreamLinks": [], "related": [1344], "message": "Thanks for sticking with this. To get it reviewable: push a branch with only the insertBefore fix (Eoghan's 2024-05-08 request), switch innerText to textContent so the differ does not reflow (billyvg's 2025-01-06 regression), and then Yun can look at the rrdom approach.", "additions": 358, "deletions": 11, "changedFiles": 4, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": "moved", "movedFrom": "review"}, {"id": 1356, "kind": "pr", "title": "use native setTimeout when zone.js is present", "url": "https://github.com/rrweb-io/rrweb/pull/1356", "author": "mdellanoce", "authorName": "Michael Dellanoce", "createdAt": "2023-11-17T16:39:03Z", "updatedAt": "2026-06-08T08:41:16Z", "draft": false, "reviewDecision": "CHANGES_REQUESTED", "who": "community", "whoLabel": "Community", "triage": "cleanup", "tags": ["posthog-declined", "community", "changes-requested", "bulk-updated"], "next": "Author: rebase onto 2.2.0, drop the rAF commit, and build on the angularZoneUnpatchedAlternative helper from 1633.", "reason": "Routes setTimeout, addEventListener and requestAnimationFrame in record code to the pre-zone.js natives so Angular change detection does not loop at 100 percent CPU. Justin requested changes on 2023-12-01 asking for a guard against future accidental use of the patched setTimeout; the author answered on 2023-12-05 with renames and fixes but no guard, and added an rAF commit in May 2024. Since then 1328 removed the rAF loop, 1971 rewrote observer.ts and the managers, and 1633 (merged 2026-10-26) added a Zone.__symbol__ helper in @rrweb/utils that this should reuse, so the branch needs a rebuild before a re-review is useful.", "notes": "", "downstream": "PostHog declined: they have their own Zone path.", "downstreamLinks": [{"label": "PostHog/posthog-js#3765", "url": "https://github.com/PostHog/posthog-js/issues/3765", "note": "They explicitly declined to adopt this from that review."}], "related": [], "message": "Justin's 2023-12-01 request for a guard against accidental use of the patched setTimeout is still open. Since then #1633 landed an angularZoneUnpatchedAlternative helper; please rebase onto 2.2.0, drop the rAF commit, and build on that helper so the two approaches do not diverge.", "additions": 86, "deletions": 36, "changedFiles": 10, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": "moved", "movedFrom": "review"}, {"id": 1336, "kind": " (w3c csswg-drafts 2515). Eoghan sketched an innerText-comparison fix in 2024-06; eliavb43 reported on 2026-10-19 that rrweb 2.1.7 still breaks GitHub button borders and shared a workaround that keeps the original source when a stringified sheet has empty declarations. Nobody has turned either into a fix.", "notes": "", "downstream": "", "downstreamLinks": [], "related": [], "message": "Could someone from core take a look at this? It’s a focused change, not a product-strategy fork.\n\nEoghan's draft holds only a failing test showing that CSSOM serializes a shorthand set from a CSS variable as empty longhands (w3c csswg-drafts 2515). Eoghan sketched an innerText-comparison fix in 2024-06; eliavb43 reported on 2026-10-19 that rrweb 2.1.7 still breaks GitHub button borders and shared a workaround that keeps the original source when a stringified sheet has empty declarations. Nobody has turned either into a fix.\n\nEoghan: decide whether to adopt the empty-declaration fallback from the 2026-10-19 comment as a real fix, or convert this draft into an issue.", "additions": 252, "deletions": 0, "changedFiles": 4, "mergeable": "CONFLICTING", "labels": [], "assignees": [], "change": "moved", "movedFrom": "cleanup"}, {"id": 1320, "kind": "pr", "title": "Fix a replay issue where the 500ms timeout was being hit", "url": "https://github.com/rrweb-io/rrweb/pull/1320", "author": "eoghanmurray", "authorName": "Eoghan Murray", "createdAt": "2023-10-09T13:15:46Z", "updatedAt": "2026-06-26T20:24:57Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "maintainer", "whoLabel": "Eoghan", "triage": "review", "tags": ["maintainer", "waiting-on-review"], "next": "Justin: review and merge; ask Eoghan for a small fixture test if cheap.", "reason": "Eoghan's replay fix: queueToResolveTrees puts a root tree first when another root depends on it, avoiding cascading requeues that hit the 500ms timeout on large table inserts. JonasBa flagged the O(n^2) unshift on 2023-10-09 and accepted the reasoning. Running at Statcounter since Oct 2023 (comment 2026-06-11), rebased 2026-06-26, but has no regression test and is not on main.", "notes": "", "downstream": "", "downstreamLinks": [{"label": "PostHog/posthog-js#3765", "url": "https://github.com/PostHog/posthog-js/issues/3765", "note": "On their adopt / adopt-high list. Not treated as shipped unless a port PR is linked."}], "related": [], "message": "Could someone from core take a look at this? It’s a focused change, not a product-strategy fork.\n\nEoghan's replay fix: queueToResolveTrees puts a root tree first when another root depends on it, avoiding cascading requeues that hit the 500ms timeout on large table inserts. JonasBa flagged the O(n^2) unshift on 2023-10-09 and accepted the reasoning. Running at Statcounter since Oct 2023 (comment 2026-06-11), rebased 2026-06-26, but has no regression test and is not on main.\n\nJustin: review and merge; ask Eoghan for a small fixture test if cheap.", "additions": 16, "deletions": 1, "changedFiles": 2, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": null, "movedFrom": null}, {"id": 1313, "kind": "pr", "title": "[rrweb] Fix hookSetter maximum call stack exceeded", "url": "https://github.com/rrweb-io/rrweb/pull/1313", "author": "VladimirMilenko", "authorName": "Vladimir Milenko", "createdAt": "2023-09-27T11:20:42Z", "updatedAt": "2026-06-08T08:41:15Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "community", "whoLabel": "Community", "triage": "cleanup", "tags": ["community", "waiting-on-review", "bulk-updated"], "next": "Author: rename the marker as Eoghan asked on 2023-10-06, restore the deleted comment, add a changeset; then Eoghan reviews.", "reason": "Guards hookSetter against re-hooking the same property with a __hooked__ marker, for open issue 731 (too much recursion). Eoghan asked on 2023-10-06 to use an rrweb-branded marker name like __rrHooked and the author never replied. Main's hookSetter is unchanged, so the fix is still relevant and the branch is MERGEABLE.", "notes": "", "downstream": "PostHog batch-2 candidate; no later production write-up.", "downstreamLinks": [{"label": "PostHog/posthog-js#3765", "url": "https://github.com/PostHog/posthog-js/issues/3765", "note": "On their adopt / adopt-high list. Not treated as shipped unless a port PR is linked."}], "related": [731], "message": "Thanks for this — the direction looks useful. Before we can review it on current `main`, please rebase, add a changeset, and add a regression test for the reported case. If that doesn’t happen in two weeks we’ll close it; open a new PR if this is still relevant.\n\nGuards hookSetter against re-hooking the same property with a __hooked__ marker, for open issue 731 (too much recursion). Eoghan asked on 2023-10-06 to use an rrweb-branded marker name like __rrHooked and the author never replied. Main's hookSetter is unchanged, so the fix is still relevant and the branch is MERGEABLE.", "additions": 25, "deletions": 2, "changedFiles": 1, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": null, "movedFrom": null}, {"id": 1302, "kind": "pr", "title": "perf(rrweb): optimize random shuffled addList", "url": "https://github.com/rrweb-io/rrweb/pull/1302", "author": "wfk007", "authorName": "fukang wang", "createdAt": "2023-09-09T15:26:37Z", "updatedAt": "2026-06-08T08:41:15Z", "draft": true, "reviewDecision": "REVIEW_REQUIRED", "who": "community", "whoLabel": "Community", "triage": "reject", "tags": ["posthog-shipped", "community", "draft", "bulk-updated"], "next": "Eoghan: close; 1652 (merged 2026-09-17) covers the ordering case and 1300 closes with it.", "reason": "Re-inserts nodes into addedSet to fix emit order for shuffled addLists. mdellanoce showed a performance regression on jstree-style mutations (2023-10-27) and the author moved it to draft saying the approach is not optimal (2023-10-30). The linear-time alternative lives in 1300, which the thread treats as the follow-up. Eoghan's 2025-02-04 question about 1277 went unanswered. Verified 2026-11-06: 1652's merged description names this PR as the prior attempt at the case it solves.", "notes": "", "downstream": "Shipped posthog-js 4130. They almost diverged to Set.delete; reverted to upstream has→delete→add. Later 4697: empty-payload early return skips addedSet/droppedSet reset — still present here.", "downstreamLinks": [{"label": "PostHog/posthog-js#4130", "url": "https://github.com/PostHog/posthog-js/pull/4130", "note": "Shipped adopt. They kept has→delete→add."}, {"label": "PostHog/posthog-js#4697", "url": "https://github.com/PostHog/posthog-js/pull/4697", "note": "Empty-payload early return skips addedSet reset — still missing in this tree."}], "related": [], "message": "Closing: #1652 merged on 2026-09-17 and reworked addedSet iteration for exactly these shuffled addList cases, and this branch had a measured regression on jstree-style mutations. Thanks for pushing on it; the benchmark fixtures would still be welcome as a separate PR if they show a gap on 2.2.x.", "additions": 7, "deletions": 1, "changedFiles": 1, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": "moved", "movedFrom": "cleanup"}, {"id": 1300, "kind": "pr", "title": "fix(perf): benchmark processMutations/addList worst case performance", "url": "https://github.com/rrweb-io/rrweb/pull/1300", "author": "mdellanoce", "authorName": "Michael Dellanoce", "createdAt": "2023-09-07T18:04:24Z", "updatedAt": "2026-06-08T08:41:15Z", "draft": true, "reviewDecision": "REVIEW_REQUIRED", "who": "community", "whoLabel": "Community", "triage": "reject", "tags": ["community", "draft", "bulk-updated"], "next": "Eoghan: close with a pointer to 1652; invite the author to resubmit just the two benchmark fixtures if they still show a gap.", "reason": "Draft from 2023 that adds two mutation benchmarks and a naive extra pass over addList to fix N squared worst-case recording cost for shuffled node insertions. Eoghan's 1652, merged 2026-09-17, refactored addedSet iteration specifically to solve those pathological addList cases and cites 1302 as a prior attempt. The fix here is superseded; the benchmark HTML fixtures may still be worth having on their own. Verified 2026-11-06: 1652's merged description names the repeated pushAdd onto the secondary addList as the pathological case it solves and lists 1302 as the prior attempt.", "notes": "", "downstream": "", "downstreamLinks": [], "related": [], "message": "Closing: #1652 merged on 2026-09-17 and solves the pathological addList ordering this targeted. If the two benchmark fixtures still show a gap on 2.2.x, please resubmit just those.", "additions": 169, "deletions": 158, "changedFiles": 6, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": "moved", "movedFrom": "cleanup"}, {"id": 1290, "kind": "pr", "title": "[rrvideo] feat:  support config chrome launch options", "url": "https://github.com/rrweb-io/rrweb/pull/1290", "author": "xujiujiu", "authorName": "九酒", "createdAt": "2023-08-15T06:23:18Z", "updatedAt": "2026-06-08T08:41:15Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "community", "whoLabel": "Community", "triage": "adopt", "tags": ["community", "waiting-on-review", "bulk-updated"], "next": "Yun: rebase if needed, add a changeset for rrvideo and merge.", "reason": "Adds a launchOptions field to the rrvideo config file and passes it to chromium.launch, so Linux users can set --no-sandbox (issue 1289, still open). Small and self-contained; main still only exposes headless. No changeset and the 2023 cli.ts typing may need a rebase.", "notes": "", "downstream": "", "downstreamLinks": [], "related": [1289], "message": "This looks small and correct enough to adopt after rebase + green CI. Approving.\n\nAdds a launchOptions field to the rrvideo config file and passes it to chromium.launch, so Linux users can set --no-sandbox (issue 1289, still open). Small and self-contained; main still only exposes headless. No changeset WN", "labels": [], "assignees": [], "change": null, "movedFrom": null}, {"id": 1256, "kind": "pr", "title": "feat: add safeCrossOrigin option", "url": "https://github.com/rrweb-io/rrweb/pull/1256", "author": "BeichenPlus", "authorName": "BeiChenPlus", "createdAt": "2023-07-12T10:25:17Z", "updatedAt": "2026-06-08T08:41:15Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "community", "whoLabel": "Community", "triage": "reject", "tags": ["strengthens-privacy", "community", "waiting-on-review", "bulk-updated"], "next": "Eoghan: close pointing at 1991 (or 1679) once the team picks one.", "reason": "Adds recordSafeCrossOrigin as the postMessage target origin for child iframes (#1190). Yun left doc suggestions on 2023-08-04 and nothing since. 1679 does the same thing and 1991 goes further with origin scoping on both send and receive sides, so this is superseded.", "notes": "", "downstream": "", "downstreamLinks": [], "related": [1991, 1679, 1190], "message": "Closing in favor of #1991, which covers the same ground. Please move any extra test cases there.\n\nAdds recordSafeCrossOrigin as the postMessage target origin for child iframes (#1190). Yun left doc suggestions on 2023-08-04 and nothing since. 1679 does the same thing and 1991 goes further with origin scoping on both send and receive sides, so this is superseded.\n\nIf this is still relevant, please open a new PR against current `main` with a rebase, a changeset, and a regression test. We’re closing stale work so intake can restart.", "additions": 12, "deletions": 3, "changedFiles": 5, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": null, "movedFrom": null}, {"id": 1235, "kind": "pr", "title": "Fix iframe shadowdomed canvas not being captured bug.", "url": "https://github.com/rrweb-io/rrweb/pull/1235", "author": "davidleon", "authorName": "davidleon", "createdAt": "2023-06-01T10:48:31Z", "updatedAt": "2026-06-08T08:41:15Z", "draft": false, "reviewDecision": "REVIEW_REQUIRED", "who": "co Eoghan: fold this into the privacy-at-capture design together with 1972, and decide whether the author should rebase the 2023 branch.", "reason": "Extends maskAllInputs to mask option text and the value attribute of option, radio and checkbox inputs. Yun requested changes on 2023-03-05 and said on 2023-03-19 he would merge once a radio leak in input mutations was fixed; the author fixed it on 2023-03-20 and rebased on 2023-07-07, then nothing until Eoghan added the privacy label and requested a review from drakonen on 2026-11-06. It changes the masking contract and overlaps the privacy policy work and drakonen's 1972, which omits checked state for masked checkbox and radio inputs.", "notes": "", "downstream": "", "downstreamLinks": [{"label": "PostHog/posthog-js#3765", "url": "https://github.com/PostHog/posthog-js/issues/3765", "note": "On their adopt / adopt-high list. Not treated as shipped unless a port PR is linked."}], "related": [1972, 1989, 1912], "message": "Holding this for a team discussion rather than merging or closing from the thread.\n\nExtends maskAllInputs to mask option text and the value attribute of option, radio and checkbox inputs. Yun requested changes on 2023-03-05 and said on 2023-03-19 he would merge once a radio leak in input mutations was fixed; the author fixed it on 2023-03-20 and rebased on 2023-07-07, then nothing until Eoghan added the privacy label and requested a review from drakonen on 2026-11-06. It changes the masking contract and overlaps the privacy policy work and drakonen's 1972, which omits checked state for masked checkbox and radio inputs.", "additions": 1167, "deletions": 517, "changedFiles": 11, "mergeable": "UNKNOWN", "labels": [], "assignees": [], "change": null, "movedFrom": null}, {"id": 1149, "kind": "pr", "title": "add @rrweb/cutter and a Sync Replayer", "url": "https://github.com/rrweb-io/rrweb/pull/1149", "author": "YunFeng0817", "authorName": "Yun Feng", "createdAt": "2023-02-21T12:21:03Z", "updatedAt": "2026-06 const FILTER_KEY = "rrweb-triage-filters";
function loadFilters() {
  try {
    const saved = JSON.parse(localStorage.getItem(FILTER_KEY) || "null");
    if (!saved) return;
    const known = (ids, list) => new Set((ids || []).filter((id) => list.some((x) => x.id === id)));
    state.buckets = known(saved.buckets, BUCKETS);
    state.narrow = known(saved.narrow, NARROWS);
    if (["all", "pr", "issue"].includes(saved.kind)) state.kind = saved.kind;
    if (["all", "maintainer", "community"].includes(saved.who)) state.who = saved.who;
    if (SORTS.some((x) => x.id === saved.sort)) state.sort = saved.sort;
  } catch {}
}
function saveFilters() {
  try {
    localStorage.setItem(FILTER_KEY, JSON.stringify({
      buckets: [...state.buckets], narrow: [...state.narrow], kind: state.kind, who: state.who, sort: state.sort,
    }));
  } catch {}
}
