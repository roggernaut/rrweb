# Runs the focused pre-release checks on stable browsers for every pull
# request that touches recording code. Each target runs twice on one runner,
# once with the pull request's rrweb and once with the base branch's, and the
# pull request fails only for checks that fail with its rrweb alone. Adding
# the `safari` label also runs Safari on macOS. It opens no issues and uses
# no secrets. packages/prerelease-browsers/README.md ("Per-PR runs") explains
# how to read and reproduce what it finds.
name: Pre-release browsers (pull request)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'packages/rrweb/**'
      - 'packages/rrweb-snapshot/**'
      - 'packages/rrdom/**'
      - 'packages/types/**'
      - 'packages/utils/**'
      - 'packages/prerelease-browsers/**'
      - '.github/workflows/prerelease-browsers-pr.yml'

concurrency:
  group: prerelease-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build rrweb from the pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Build rrweb
        run: NODE_OPTIONS='--max-old-space-size=4096' yarn turbo run prepublish --filter=rrweb

      - name: Upload the rrweb build
        uses: actions/upload-artifact@v4
        with:
          name: rrweb-dist-pr
          path: packages/rrweb/dist
          if-no-files-found: error
          overwrite: true

  build-base:
    name: Build rrweb from the base branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Build rrweb
        run: NODE_OPTIONS='--max-old-space-size=4096' yarn turbo run prepublish --filter=rrweb

      - name: Upload the rrweb build
        uses: actions/upload-artifact@v4
        with:
          name: rrweb-dist-base
          path: packages/rrweb/dist
          if-no-files-found: error
          overwrite: true

  linux:
    name: Linux ${{ matrix.target }}
    needs: [build, build-base]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The summary job lists these targets again in its expected ids.
        target: [chrome-stable, edge-stable, firefox-stable, local-webkit]
    env:
      T: ${{ matrix.target }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      # Measured from the start of the job, so both roles finish inside its
      # 30 minutes with time left to upload the results.
      - name: Set the deadline
        run: echo "PRERELEASE_DEADLINE=$(date -u -d '+25 minutes' +%FT%TZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Download the pull request's rrweb build
        uses: actions/download-artifact@v4
        with:
          name: rrweb-dist-pr
          path: packages/rrweb/dist

      - name: Download the base branch's rrweb build
        uses: actions/download-artifact@v4
        with:
          name: rrweb-dist-base
          path: ${{ runner.temp }}/base-dist

      - name: Install ${{ matrix.target }}
        working-directory: packages/prerelease-browsers
        run: |
          set -euo pipefail
          if [ "$T" = local-webkit ]; then
            npx playwright install --with-deps webkit
          else
            node src/node/install.ts "$T" "$RUNNER_TEMP/browsers" >> "$GITHUB_ENV"
          fi

      - name: Run ${{ matrix.target }} with the pull request's rrweb
        run: xvfb-run --server-args="-screen 0 1920x1080x24" yarn workspace @rrweb/prerelease-browsers run-target --target "$T" --pr-role pr --deadline "$PRERELEASE_DEADLINE"

      - name: Run ${{ matrix.target }} with the base branch's rrweb
        if: '!cancelled()'
        run: xvfb-run --server-args="-screen 0 1920x1080x24" yarn workspace @rrweb/prerelease-browsers run-target --target "$T" --pr-role base --rrweb-dist "$RUNNER_TEMP/base-dist" --rrweb-commit "$BASE_SHA" --deadline "$PRERELEASE_DEADLINE"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-results-${{ matrix.target }}
          path: packages/prerelease-browsers/results
          overwrite: true

  safari:
    name: macOS safari-stable
    needs: [build, build-base]
    if: contains(github.event.pull_request.labels.*.name, 'safari')
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Set the deadline
        run: echo "PRERELEASE_DEADLINE=$(date -u -v+25M +%FT%TZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Download the pull request's rrweb build
        uses: actions/download-artifact@v4
        with:
          name: rrweb-dist-pr
          path: packages/rrweb/dist

      - name: Download the base branch's rrweb build
        uses: actions/download-artifact@v4
        with:
          name: rrweb-dist-base
          path: ${{ runner.temp }}/base-dist

      - name: Enable Safari's driver
        run: sudo safaridriver --enable

      - name: Run safari-stable with the pull request's rrweb
        run: yarn workspace @rrweb/prerelease-browsers run-target --target safari-stable --pr-role pr --deadline "$PRERELEASE_DEADLINE"

      - name: Run safari-stable with the base branch's rrweb
        if: '!cancelled()'
        run: yarn workspace @rrweb/prerelease-browsers run-target --target safari-stable --pr-role base --rrweb-dist "$RUNNER_TEMP/base-dist" --rrweb-commit "$BASE_SHA" --deadline "$PRERELEASE_DEADLINE"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-results-safari-stable
          path: packages/prerelease-browsers/results
          overwrite: true

  # The job a branch rule can require; see "Per-PR runs" in the README
  # before making it required.
  summary:
    name: Pre-release browsers summary
    needs: [linux, safari]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # A job that never uploaded shows up as missing targets, so a failed
      # download must not stop the summary.
      - name: Download results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: pr-results-*
          merge-multiple: true
          path: packages/prerelease-browsers/results

      # pr-summary.ts needs only Node's built-in modules, so no install.
      - name: Summarize
        working-directory: packages/prerelease-browsers
        env:
          SAFARI: ${{ contains(github.event.pull_request.labels.*.name, 'safari') }}
        run: |
          set -euo pipefail
          expected=()
          for id in chrome-stable edge-stable firefox-stable local-webkit; do
            expected+=("$id@pr" "$id@base")
          done
          if [ "$SAFARI" = true ]; then
            expected+=(safari-stable@pr safari-stable@base)
          fi
          node src/report/pr-summary.ts --results results --expected "$(IFS=,; echo "${expected[*]}")"
